<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio Keisya Ramadhani — Front-End Developer & UI Enthusiast dari Jakarta, Indonesia."
    />
    <title>Keisya Ramadhani | Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Pinyon+Script&family=Pixelify+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>

  <body class="page-gradient">
    <!-- Skip to content -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:rounded-full focus:bg-[var(--color-hot-pink)] focus:text-white focus:font-bold"
    >
      Lewati ke konten utama
    </a>

    <!-- ── Top Strip / Nav ── -->
    <header
      class="sticky top-0 z-40 bg-[var(--color-lime-yellow)] border-b-2 border-black"
      role="banner"
    >
      <div class="max-w-6xl mx-auto px-4 py-2 flex items-center justify-between">
        <!-- Brand -->
        <span class="font-script text-2xl leading-none select-none">
          Keisya R.
        </span>

        <!-- Desktop nav -->
        <nav aria-label="Navigasi utama" class="hidden md:block">
          <ul class="flex gap-6 font-pixel text-sm font-semibold">
            <li>
              <a
                href="#home"
                class="hover:text-[var(--color-hot-pink)] transition-colors"
              >Home</a>
            </li>
            <li>
              <a
                href="#about"
                class="hover:text-[var(--color-hot-pink)] transition-colors"
              >About Me</a>
            </li>
            <li>
              <a
                href="#experience"
                class="hover:text-[var(--color-hot-pink)] transition-colors"
              >Experience</a>
            </li>
            <li>
              <a
                href="#project"
                class="hover:text-[var(--color-hot-pink)] transition-colors"
              >Project</a>
            </li>
          </ul>
        </nav>

        <!-- Hamburger button (mobile) -->
        <button
          id="hamburger"
          type="button"
          aria-controls="mobile-menu"
          aria-expanded="false"
          aria-label="Buka menu navigasi"
          class="md:hidden flex flex-col gap-1.5 p-2 rounded focus:outline-none"
        >
          <span class="block w-6 h-0.5 bg-black"></span>
          <span class="block w-6 h-0.5 bg-black"></span>
          <span class="block w-6 h-0.5 bg-black"></span>
        </button>
      </div>

      <!-- Mobile menu -->
      <div
        id="mobile-menu"
        aria-expanded="false"
        class="hidden md:hidden border-t-2 border-black bg-[var(--color-lime-yellow)]"
      >
        <nav aria-label="Navigasi mobile">
          <ul class="flex flex-col font-pixel text-sm font-semibold">
            <li>
              <a
                href="#home"
                class="block px-6 py-3 border-b border-black/10 hover:bg-[var(--color-hot-pink)] hover:text-white transition-colors"
              >Home</a>
            </li>
            <li>
              <a
                href="#about"
                class="block px-6 py-3 border-b border-black/10 hover:bg-[var(--color-hot-pink)] hover:text-white transition-colors"
              >About Me</a>
            </li>
            <li>
              <a
                href="#experience"
                class="block px-6 py-3 border-b border-black/10 hover:bg-[var(--color-hot-pink)] hover:text-white transition-colors"
              >Experience</a>
            </li>
            <li>
              <a
                href="#project"
                class="block px-6 py-3 hover:bg-[var(--color-hot-pink)] hover:text-white transition-colors"
              >Project</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- ── Main Content ── -->
    <main id="main-content" class="max-w-6xl mx-auto px-4 py-12 space-y-24">
      <!-- Home -->
      <section id="home" aria-labelledby="heading-home" class="scroll-mt-14">
        <h1
          id="heading-home"
          class="font-script text-5xl md:text-7xl title-gradient"
        >
          Home
        </h1>
      </section>

      <!-- About -->
      <section id="about" aria-labelledby="heading-about" class="scroll-mt-14">
        <h2
          id="heading-about"
          class="font-pixel text-3xl md:text-4xl title-gradient"
        >
          About Me
        </h2>
      </section>

      <!-- Experience -->
      <section
        id="experience"
        aria-labelledby="heading-experience"
        class="scroll-mt-14"
      >
        <h2
          id="heading-experience"
          class="font-pixel text-3xl md:text-4xl title-gradient"
        >
          Experience
        </h2>
      </section>

      <!-- Skills -->
      <section id="skills" aria-labelledby="heading-skills" class="scroll-mt-14">
        <h2
          id="heading-skills"
          class="font-pixel text-3xl md:text-4xl title-gradient"
        >
          Skills
        </h2>
      </section>

      <!-- Project -->
      <section
        id="project"
        aria-labelledby="heading-project"
        class="scroll-mt-14"
      >
        <h2
          id="heading-project"
          class="font-pixel text-3xl md:text-4xl title-gradient"
        >
          Project
        </h2>
      </section>

      <!-- Certificates -->
      <section
        id="certificates"
        aria-labelledby="heading-certificates"
        class="scroll-mt-14"
      >
        <h2
          id="heading-certificates"
          class="font-pixel text-3xl md:text-4xl title-gradient"
        >
          Certificates
        </h2>
      </section>

      <!-- Contact -->
      <section
        id="contact"
        aria-labelledby="heading-contact"
        class="scroll-mt-14"
      >
        <h2
          id="heading-contact"
          class="font-pixel text-3xl md:text-4xl title-gradient"
        >
          Contact
        </h2>
      </section>
    </main>

    <!-- ── Footer ── -->
    <footer
      class="border-t-2 border-black/10 mt-24 py-6 text-center font-body text-sm text-gray-500"
      role="contentinfo"
    >
      <p>
        &copy; 2025
        <span class="font-semibold text-[var(--color-hot-pink)]">Keisya Ramadhani</span>.
        Dibuat dengan ☕ dan Tailwind CSS.
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
